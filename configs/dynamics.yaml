# Training
batch_size_per_gpu: 500
gradient_accumulation_steps: 1
n_updates: 300000
learning_rate: 0.01
log_interval: 2000

use_actions: false
tokenizer_backend: cosmos
input_mode: token_indices
cosmos_model: nvidia/Cosmos-0.1-Tokenizer-DV8x8x8
cosmos_checkpoint_dir:
cosmos_codebook_size: 65536
cosmos_temporal_compression: 8
cosmos_spatial_compression: 8

# these can vary but for convenience, here
embed_dim: 32
num_heads: 8
hidden_dim: 128
num_blocks: 8

# Paths
video_tokenizer_path:
latent_actions_path:

# resume from checkpoint
checkpoint: