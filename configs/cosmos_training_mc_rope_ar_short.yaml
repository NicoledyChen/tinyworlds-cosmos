use_wandb: false
wandb_project: tinyworlds

dataset: MICRO_WORLD_MC
preload_ratio: 1.0
fps: 30

patch_size: 8
# 33 raw frames map to exactly 5 Cosmos DV8 latent blocks:
# block 0 is the causal anchor, blocks 1-3 are history, block 4 is the target.
context_length: 33
frame_size: 256
latent_dim: 5
num_bins: 4
n_actions: 4

tokenizer_backend: cosmos
input_mode: token_indices
cosmos_model: nvidia/Cosmos-0.1-Tokenizer-DV8x8x8
cosmos_checkpoint_dir:
cosmos_codebook_size: 65536
cosmos_temporal_compression: 8
cosmos_spatial_compression: 8

# AR-style training: keep previous Cosmos blocks clean and predict only the next block.
mask_strategy: target_block
target_token_steps: 1
use_temporal_rope: true

amp: true
tf32: true
compile: false

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/video_tokenizer.yaml
latent_actions_config: configs/latent_actions.yaml
dynamics_config: configs/cosmos_dynamics_mc_rope_ar_short.yaml

run_video_tokenizer: false
run_latent_actions: false
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5

use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
