# Dynamics baseline for Cosmos DV8x8x8 token-index training.
batch_size_per_gpu: 128
gradient_accumulation_steps: 1
n_updates: 2000
learning_rate: 0.0003
log_interval: 100

use_actions: false
tokenizer_backend: cosmos
input_mode: token_indices
cosmos_model: nvidia/Cosmos-0.1-Tokenizer-DV8x8x8
cosmos_checkpoint_dir:
cosmos_codebook_size: 65536
cosmos_temporal_compression: 8
cosmos_spatial_compression: 8

embed_dim: 32
num_heads: 8
hidden_dim: 128
num_blocks: 8

video_tokenizer_path:
latent_actions_path:

checkpoint:
