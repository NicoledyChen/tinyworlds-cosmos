batch_size_per_gpu: 1
gradient_accumulation_steps: 1
n_updates: 10000
learning_rate: 0.0003
log_interval: 200

use_actions: false
tokenizer_backend: cosmos
input_mode: token_indices
cosmos_model: nvidia/Cosmos-0.1-Tokenizer-DV8x8x8
cosmos_checkpoint_dir:
cosmos_codebook_size: 65536
cosmos_temporal_compression: 8
cosmos_spatial_compression: 8

mask_strategy: target_block
target_token_steps: 1
use_temporal_rope: true

# ~0.54B params with 65,537-way token embedding/output head.
embed_dim: 1024
num_heads: 16
hidden_dim: 4096
num_blocks: 24

video_tokenizer_path:
latent_actions_path:

checkpoint:
